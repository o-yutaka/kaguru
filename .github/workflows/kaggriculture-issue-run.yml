name: Kaggriculture Issue Run

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  run-kaggriculture-notebook:
    if: startsWith(github.event.issue.title, 'RUN-KAGGRICULTURE')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGRICULTURE_KAGGLE_API_TOKEN: ${{ secrets.KAGGRICULTURE_KAGGLE_API_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Configure Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/kaggle
          if [[ -n "${KAGGRICULTURE_KAGGLE_API_TOKEN:-}" ]]; then
            printf '%s' "$KAGGRICULTURE_KAGGLE_API_TOKEN" > ~/.config/kaggle/access_token
          elif [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            printf '%s' "$KAGGLE_API_TOKEN" > ~/.config/kaggle/access_token
          elif [[ -n "${KAGGLE_JSON:-}" ]]; then
            printf '%s' "$KAGGLE_JSON" > ~/.config/kaggle/kaggle.json
            chmod 600 ~/.config/kaggle/kaggle.json
          elif [[ -n "${KAGGLE_USERNAME:-}" && -n "${KAGGLE_KEY:-}" ]]; then
            python - <<'PY'
import json, os
from pathlib import Path
p=Path.home()/'.config/kaggle/kaggle.json'
p.write_text(json.dumps({'username':os.environ['KAGGLE_USERNAME'],'key':os.environ['KAGGLE_KEY']}), encoding='utf-8')
p.chmod(0o600)
PY
          else
            echo 'No Kaggle credentials available' >&2
            exit 86
          fi
      - name: Push notebook and run
        run: |
          rm -rf /tmp/kaggriculture-kernel
          mkdir -p /tmp/kaggriculture-kernel
          cp notebooks/BLACK_Kaggriculture_Research.ipynb /tmp/kaggriculture-kernel/
          cp kaggle-kernel/kernel-metadata.json /tmp/kaggriculture-kernel/
          kaggle kernels push -p /tmp/kaggriculture-kernel
      - name: Poll Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATUS="$(kaggle kernels status o-yutaka/black-kaggriculture-research 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eiq 'complete|error|failed'; then break; fi
            sleep 20
          done
      - name: Download outputs
        run: |
          mkdir -p artifacts/kaggriculture-notebook
          kaggle kernels output o-yutaka/black-kaggriculture-research -p artifacts/kaggriculture-notebook || true
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body 'Kaggriculture Notebook execution triggered. Check workflow artifacts for the latest output.'
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-notebook-${{ github.run_id }}
          path: artifacts/kaggriculture-notebook
          if-no-files-found: warn
          retention-days: 14
